# Service = a stable internal address + load balancer for a set of pods.
# Pods come and go (new IPs every time); the Service name never changes.
# Inside the cluster this app is reachable at:
#   http://school-api.school.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: school-api
  namespace: school
spec:
  type: ClusterIP            # internal-only; the Ingress exposes it externally
  selector:
    app: school-api          # route to pods carrying this label
  ports:
    - port: 80               # port other things in the cluster call
      targetPort: 3000       # port the container actually listens on
