# Secret = sensitive configuration (passwords, connection strings).
#
# This is an EXAMPLE file. Copy it to secret.yaml (which is git-ignored),
# fill in the real value, then:  kubectl apply -f k8s/secret.yaml
#
# stringData lets you write plain text; Kubernetes stores it base64-encoded.
# In real production you would use AWS Secrets Manager + External Secrets
# Operator instead of hand-made Secret files.
apiVersion: v1
kind: Secret
metadata:
  name: school-api-secrets
  namespace: school
type: Opaque
stringData:
  # Point this at your RDS instance (see terraform/) or leave the app
  # in in-memory mode by deleting the secretKeyRef in deployment.yaml.
  DATABASE_URL: "postgres://school:CHANGE_ME@your-rds-endpoint:5432/school"
