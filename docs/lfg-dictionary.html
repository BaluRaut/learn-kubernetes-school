<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LFG Dictionary — Every Term, With an Analogy</title>
<meta name="description" content="Plain-language glossary for the LFG platform RFC: every technical term explained simply, each with a real-life analogy.">
<style>
  :root {
    --bg:#f8fafc; --card:#ffffff; --ink:#0f172a; --muted:#475569; --line:#e2e8f0;
    --blue:#2563eb; --green:#16a34a; --red:#dc2626; --amber:#d97706; --violet:#7c3aed; --cyan:#0891b2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1220; --card:#131c2e; --ink:#e2e8f0; --muted:#94a3b8; --line:#253349; }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; line-height:1.6; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px; }
  header { padding:40px 0 10px; text-align:center; }
  h1 { font-size:clamp(1.5rem,4vw,2.4rem); letter-spacing:-.02em; }
  .sub { color:var(--muted); margin:10px auto 0; max-width:720px; }
  .sub a { color:var(--blue); }
  .searchbar { position:sticky; top:0; z-index:10; background:var(--bg); padding:14px 0; }
  .searchbar input { width:100%; font:inherit; font-size:1.05rem; color:var(--ink); background:var(--card); border:2px solid var(--line); border-radius:14px; padding:12px 18px; }
  .searchbar input:focus { outline:none; border-color:var(--blue); }
  #count { color:var(--muted); font-size:.85rem; padding:6px 4px 0; display:block; }
  section { margin:34px 0; }
  section > h2 { font-size:1.25rem; margin-bottom:12px; padding-left:12px; border-left:6px solid var(--c,var(--blue)); }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px; }
  .term {
    background:var(--card); border:1px solid var(--line); border-top:5px solid var(--c,var(--blue));
    border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; gap:8px;
  }
  .term h3 { font-size:1.02rem; }
  .term .what { font-size:.9rem; color:var(--muted); }
  .term .ana { font-size:.9rem; background:color-mix(in srgb,var(--c,var(--blue)) 8%,transparent); border-left:4px solid var(--c,var(--blue)); border-radius:8px; padding:8px 12px; margin-top:auto; }
  .term .ana b { color:var(--c,var(--blue)); }
  code { font-family:Menlo,Consolas,monospace; font-size:.85em; background:color-mix(in srgb,var(--ink) 8%,transparent); padding:1px 6px; border-radius:6px; }
  .hidden { display:none !important; }
  footer { text-align:center; color:var(--muted); font-size:.85rem; padding:30px 0 50px; }
  footer a { color:var(--blue); }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>📖 LFG Dictionary — Every Term, With an Analogy</h1>
  <p class="sub">Plain-language companion to the <a href="lfg-rfc.html">RFC</a> and the
  <a href="lfg-scenarios.html">diagrams</a>. Each card: what the term means on this project,
  then a real-life analogy so it sticks.</p>
</header>

<div class="searchbar">
  <input id="q" type="search" placeholder="Type to filter… (e.g. silo, queue, batch, key)">
  <span id="count"></span>
</div>

<div id="content"><!-- generated by JS below --></div>

<footer>LFG Platform · dictionary · <a href="lfg-rfc.html">RFC</a> ·
<a href="lfg-scenarios.html">diagram gallery</a> ·
<a href="architecture-lfg.html">engineering design</a></footer>
</div>

<script>
const GROUPS = [
{ name: "🏠 The platform & tenancy", color: "var(--green)", terms: [
["LFG (Large Farm Grower)", "The customer — a big farming business with many farms, fields, crops and staff. Each LFG gets its own isolated space on the platform.",
 "One family that owns an entire apartment in the building. Everything inside the apartment is theirs alone."],
["Tenant / multi-tenancy", "One software platform serving many customers at once, while keeping each customer's data separate.",
 "An apartment building: one structure, one electricity supply, one lift — but every family has its own locked flat."],
["Silo (database per LFG)", "Each LFG's data lives in its own database. A program connected to grower A's database physically cannot read grower B's.",
 "Bank lockers: same vault room, but your key opens only your locker. Even the bank clerk can't open two lockers with one key."],
["Control plane", "The platform's own small database: the list of growers, who belongs to which, mapping templates, settings. It contains no grower field data.",
 "The building manager's office — it holds the resident register and the master plans, but none of your furniture."],
["Tenant guard", "A check that runs before every single request: is this user really a member of this grower? If not — rejected (403) before anything else happens.",
 "The doorman with the guest list. Wrong name for this floor? You don't even reach the lift."],
["Membership", "A record saying 'this user belongs to this LFG, with this role'. Deleting it cuts access within about a minute.",
 "Your name on the guest list. Struck off the list → the doorman stops you at the next visit."],
["Persona & data scope", "A role plus a boundary: what a user may do AND which slice of data they may see (only certain regions, farms, or fields).",
 "Hotel key cards: housekeeping's card opens rooms on floor 3 only; the manager's opens everything. Same building, different reach."],
["Encrypted route id", "Each LFG's page lives at a scrambled address like /g/9f3ac1… — no company name, no real ID in the URL, and it can be changed anytime.",
 "A hotel safe code instead of a name plate on the door. Knowing the corridor doesn't tell you whose safe it is — and the code can be reset."],
]},
{ name: "🔑 Identity & login", color: "var(--violet)", terms: [
["Cropwise Base", "The existing Syngenta system that owns logins, organizations, properties and fields. Our platform never re-builds any of that.",
 "The government ID office. We don't issue passports — we just check yours at the door."],
["Token (JWT)", "A signed digital pass a user carries after logging in. It proves who they are for a short time.",
 "A stamped wristband from the entry gate — valid for the evening, checkable by any staff member, impossible to forge without the stamp."],
["JWKS verification", "How we check a token is genuine: we fetch Cropwise Base's public keys and verify the signature — without ever seeing anyone's password.",
 "Checking a banknote under UV light. You don't need the mint's printing press — just the light that reveals the real watermark."],
["Reference ID (cb_field_ref)", "We store only Cropwise Base's ID numbers for fields and orgs — never a copy of the field's shape or details. Need the details? Ask CB.",
 "Writing down a book's library number instead of photocopying the whole book. The library always has the newest edition."],
]},
{ name: "📊 Data model", color: "var(--blue)", terms: [
["Variety layer", "The list of crop varieties (seed types) an LFG works with, kept per country and per crop — e.g. BR-soybean varieties vs US-potato varieties.",
 "A seed catalogue with one chapter per country and crop. New variety? Add a line to the chapter — no need to reprint the catalogue."],
["Metric registry", "The rulebook for every measurement: its name, unit, and allowed range — per country and crop. Uploads are checked against it.",
 "A dictionary that also says which words are legal in which country. 'Yield 950' is fine in one chapter and a spelling error in another."],
["Metrics as rows (fact_rows)", "Each measurement is stored as its own row ('field 7, 2024, yield, 62') instead of adding a new column for every metric.",
 "A ledger book: every entry is a line. You never have to buy a new ledger just because a new type of expense appears."],
["batch_id", "Every row remembers which upload (batch) created it. That makes any upload traceable and reversible as a whole.",
 "The receipt number printed on every item from one shopping trip. Return the receipt → return exactly that trip's items, nothing else."],
["Commit boundary", "During processing, nothing is saved. Only at the final step does data enter the real tables — all stamped with one batch_id.",
 "The supermarket checkout: your trolley isn't yours while you shop. One payment at one counter — then it's all yours at once."],
["Rollback", "Undoing one entire upload with a single action: delete everything carrying that batch_id. Nothing else is touched.",
 "Returning one shopping trip with one receipt — the store doesn't rummage through your fridge to find the items."],
["Entity alias & worklist", "When a file says 'Talhao 7' and the system doesn't recognize it, the row waits in a to-resolve list. Once mapped, the nickname is remembered forever.",
 "A contacts app learning that 'Mom', 'Mummy' and 'Amma' are all the same person. Teach it once; every future message routes correctly."],
["Mapping template", "A saved recipe for reading an LFG's file format: which column means what, in which unit. Saved once, reused for every future upload.",
 "Teaching a new cook to read grandma's handwritten recipes once — after that, any dish she writes can be cooked without asking."],
["Season window", "The date range a growing season covers — different per country ('15 Apr–15 Oct' in the north, '12 Oct–15 Jan' in the south). Zones are computed per window.",
 "School years: June–April in India, September–June in the US. Same idea of 'a year', different calendar dates."],
["Supersede, never edit", "When zoning is recomputed, the old result is kept and marked 'replaced by the new one' — history is never overwritten.",
 "New editions of a textbook. The 2024 edition replaces the 2023 one on the syllabus, but the library keeps both — you can always check what the old edition said."],
]},
{ name: "🛰️ Zones & FVA", color: "var(--cyan)", terms: [
["Zone", "A part of a field that behaves differently from the rest — more or less productive. Fields get split into 2–5 such areas.",
 "A stadium's seating map: front rows, middle, back. Same stadium, very different views — priced (planted) accordingly."],
["FVA (Field Variability Analysis)", "The analysis (from AgInsights, using satellite imagery) that measures how uneven a field is and draws its zones.",
 "A doctor's full-body scan for a field: one report showing which parts are healthy, which are weak, and how much they differ."],
["NDVI", "A 'greenness' score computed from satellite images — how much healthy vegetation a spot has, from 0 (bare) to 1 (lush).",
 "The doctor checking the color under your eyelids — a quick visual sign of health, measured from a distance."],
["PAF / pafSpread", "Productivity Adjustment Factor: how much better or worse a zone performs vs the field average. The spread = gap between best and worst zone.",
 "Class grades: PAF is each student's score vs the class average; the spread is the gap between the topper and the last rank — a big gap means an uneven class."],
["AgInsights batch job", "Our scheduled worker asks AgInsights for zones/FVA for many fields at once — never while a user is waiting on a page.",
 "Sending the whole office's laundry out overnight instead of washing one shirt while the meeting waits."],
]},
{ name: "⚙️ Jobs & queues", color: "var(--amber)", terms: [
["Queue (SQS)", "A waiting line for work. Requests to compute something are dropped in; workers pick them up one by one. Nobody stands around waiting.",
 "The token system at a bakery counter: take a number, sit down; you'll be served in order even if the shop is packed."],
["Worker", "A background program that takes jobs from the queue and does the heavy lifting (calling AgInsights, validating files) away from the website.",
 "Kitchen staff. The waiter (API) takes orders fast; the kitchen cooks them at its own pace."],
["KEDA / auto-scaling", "When the queue grows, more workers start automatically; when it empties, they shut down (to zero) — you pay only for busy time.",
 "A restaurant that calls in extra cooks when the token machine is spitting numbers, and sends them home when the rush ends."],
["Interactive vs backfill lanes", "Two queues: 'a user is waiting' jobs jump ahead; huge scheduled batches run in the slow lane. Bulk work never blocks a person.",
 "The express checkout (10 items or less) next to the regular lanes. The person buying milk doesn't wait behind a trolley mountain."],
["DLQ (dead-letter queue)", "Where a job goes after failing several retries — parked with its error message, alarm raised, ready to re-run after the cause is fixed.",
 "The lost-luggage office. Your bag isn't gone — it's on a labelled shelf with a note about what went wrong, waiting for someone to sort it."],
["Idempotency", "Doing the same thing twice has the same effect as doing it once. A duplicated job or double-click can't create double data.",
 "Pressing the lift button five times — one lift comes. The button remembers it's already been asked."],
["Cron / scheduler", "A timer that starts jobs automatically at set times — nightly batches, seasonal window rolls.",
 "An alarm clock for the system: 2 AM, wake up, run the batch, go back to sleep."],
["Login trigger", "When a user logs into Seed Selector, it quietly drops a job in the queue for their newly added fields — login itself never waits.",
 "Walking into the office trips the sensor that starts the coffee machine. You don't stand by the machine — coffee's ready by the time you sit."],
]},
{ name: "🗄️ Storage", color: "var(--blue)", terms: [
["PostgreSQL / RDS", "The main database: organized tables you can search, filter and sort instantly. AWS runs the machine for us (that's RDS).",
 "A filing cabinet with perfect index cards — ask for 'yield, 2024, field 7' and the right folder is out in a second."],
["S3", "Cheap, infinitely large storage for big files: raw uploads and zone geometry dumps. Great for keeping, not for searching inside.",
 "A warehouse with numbered boxes. Fantastic for storing everything forever; terrible for asking 'which box mentions field 7?' — that's the cabinet's job."],
["Presigned URL", "A temporary, single-purpose download link the server creates so the browser can fetch a big file straight from S3.",
 "A visitor pass valid 15 minutes for one specific room. After that, the pass is just paper."],
["Versioning", "S3 keeps every version of a file — overwrite or delete, and the previous versions are still there.",
 "'Track changes' in a document — every save is kept; you can always open yesterday's version."],
["Lifecycle / Glacier", "Automatic rules that move old files to cheaper, slower storage (Glacier) and control when anything may expire. Ours: cold at 2 years, kept 20.",
 "Moving old files from the office shelf to the basement archive: cheaper to keep, slower to fetch, still yours."],
["PITR (point-in-time recovery)", "The database continuously records every change, so it can be rewound to any second in the recent past.",
 "A dashcam for the database — not photos every hour, but continuous footage. Rewind to 14:03:27 if that's when things went wrong."],
]},
{ name: "🛡️ Security", color: "var(--red)", terms: [
["WAF (Web Application Firewall)", "The first filter at the front door: blocks known attack patterns (SQL injection, cross-site scripting) and abusive IPs before they reach the app.",
 "The metal detector at the entrance — obvious weapons never make it into the building."],
["Rate limiting / throttling", "Caps on how many requests a user (or a whole LFG) can make per minute — strictest on login attempts.",
 "A bouncer letting people in at a steady pace. One over-excited guest can't stampede the door for everyone."],
["Encryption in transit (TLS)", "Data is scrambled while travelling over the network — browser to server, server to database. Eavesdroppers see gibberish.",
 "A sealed, tamper-evident envelope. The postman carries it; only the addressee can open it."],
["Encryption at rest (KMS)", "Data is also scrambled while sitting on disk, and each LFG's data uses its own key. AWS's key service (KMS) guards the keys.",
 "Every family's valuables in their own safe, each with a different combination. Stealing the cupboard gets you locked safes."],
["Secrets Manager", "The vault where passwords and keys live. Programs fetch them at startup; humans never paste them into code. Keys rotate on schedule.",
 "A key cabinet whose locks change themselves every month — and nobody is allowed to copy a key onto a sticky note."],
["Audit log", "An append-only record of every important action: who did what, to which grower's data, when, from where. It can be added to — never edited.",
 "CCTV that records everything and physically cannot be rewound-and-taped-over. Even the manager can't erase Tuesday."],
["Defense in depth", "Many independent security layers, each assuming the previous one failed: WAF, throttles, guard, validation, audit.",
 "A castle: moat, outer wall, gate guards, inner keep, vault. Getting past one obstacle just introduces you to the next."],
["Blast radius", "How much damage one failure or leak can cause. Our design keeps it to one grower — never the whole platform.",
 "Dropping one plate vs pulling down the whole shelf. The kitchen is arranged so a slip costs one plate."],
]},
{ name: "🚑 Recovery & operations", color: "var(--violet)", terms: [
["RPO (Recovery Point Objective)", "The maximum data you could lose in a disaster — measured in time. Ours: at most 1 hour (usually minutes, thanks to PITR).",
 "How much of your essay disappears if the laptop dies = time since you last hit save. We auto-save at least hourly, usually continuously."],
["RTO (Recovery Time Objective)", "How long until the system is working again after a disaster. Ours: one silo back in under 1 hour; a whole region in under 4.",
 "After a power cut: how long before the lights are back on. Not 'did we lose the fridge food' (that's RPO) — 'when can we cook again'."],
["DR (disaster recovery)", "The written, rehearsed plan for the bad days: a corrupted database, a deleted file, an entire AWS region going down.",
 "The fire evacuation plan on the wall — decided, printed and practiced before there's smoke, not during."],
["Runbook", "Step-by-step emergency instructions anyone on the team can follow at 3 AM, written so it works even if its author is on holiday.",
 "A recipe card for emergencies: exact steps, exact order, no creativity required at the worst possible moment."],
["Multi-AZ", "The database runs in two separate data-center buildings at once; if one fails, the other takes over in about a minute.",
 "Twin generators in two different rooms. One floods — the lights flicker, then stay on."],
["Cross-region replication", "Copies of images and files are automatically kept in a second geographic region, far from the first.",
 "A photocopy of every important document stored in another city. The office can burn down; the paperwork survives."],
["Restore drill", "Regularly practicing an actual restore from backup — because an untested backup is only a hope.",
 "Fire drills. You don't discover the emergency exit is locked during a real fire."],
["Alarm / observability", "Dashboards and automatic alerts watching queue ages, failed uploads, missing backups — problems page the ops team, not the users.",
 "Smoke detectors through the house — you want the beep at the first wisp, not the neighbours calling about flames."],
]},
{ name: "🧰 Building blocks", color: "var(--green)", terms: [
["API", "The service's counter: the fixed set of requests the UI (or a script) can make — 'list fields', 'upload file', 'get zones'.",
 "The waiter: you order from a menu; the kitchen's chaos stays in the kitchen. You never cook at your table."],
["NestJS", "The framework our backend is written in (TypeScript). It gives structure: guards for checks, modules for features.",
 "A pre-organized toolbox with labelled drawers — every tool has a place, so five engineers can share it without chaos."],
["Docker container", "An app packed with everything it needs to run, so it behaves identically on a laptop, a test server and production.",
 "A packed lunchbox: dish, cutlery, napkin, sauce — the meal is the same wherever you open it."],
["Kubernetes / EKS", "The system that runs many containers: restarts crashed ones, adds copies under load, rolls out new versions with zero downtime. EKS = AWS runs it for us.",
 "An orchestra conductor: brings musicians in, replaces one who faints mid-concert, and the audience never hears a gap."],
["Terraform (IaC)", "Our AWS infrastructure written as code files. Run them → the environment builds itself, identically, every time.",
 "An architect's blueprint that constructs the building at the press of a button — and can build an identical one in another city tomorrow."],
["CI/CD pipeline", "The assembly line from code change to production: tests run, the app is packaged, deployed to sandbox, and only a human approval releases to production.",
 "A factory line with quality checks at every station — and a final supervisor who presses the green button before anything ships."],
["Sandbox vs production", "Two copies of the whole system: sandbox is where changes are tried and drills run; production is where real growers work.",
 "Dress rehearsal vs opening night. Same stage design — but nobody sells tickets to the rehearsal."],
]},
];

const content = document.getElementById('content');
for (const g of GROUPS) {
  const sec = document.createElement('section');
  sec.style.setProperty('--c', g.color);
  sec.innerHTML = `<h2>${g.name}</h2><div class="cards">` + g.terms.map(([t, what, ana]) =>
    `<article class="term" style="--c:${g.color}" data-text="${(t + ' ' + what + ' ' + ana).toLowerCase().replace(/"/g,'')}">
       <h3>${t}</h3>
       <p class="what">${what}</p>
       <p class="ana"><b>Think of it like:</b> ${ana}</p>
     </article>`).join('') + '</div>';
  content.appendChild(sec);
}

const q = document.getElementById('q');
const count = document.getElementById('count');
const all = [...document.querySelectorAll('.term')];
function refresh() {
  const needle = q.value.trim().toLowerCase();
  let shown = 0;
  for (const el of all) {
    const hit = !needle || el.dataset.text.includes(needle);
    el.classList.toggle('hidden', !hit);
    if (hit) shown++;
  }
  for (const sec of document.querySelectorAll('#content section')) {
    const any = [...sec.querySelectorAll('.term')].some((t) => !t.classList.contains('hidden'));
    sec.classList.toggle('hidden', !any);
  }
  count.textContent = needle ? `${shown} of ${all.length} terms match` : `${all.length} terms`;
}
q.addEventListener('input', refresh);
refresh();
</script>
</body>
</html>
