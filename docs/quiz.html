<!DOCTYPE html>

<html lang="mr"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/>

<meta content="Quiz — ☸️ Kubernetes" property="og:title"/><meta content="10 questions with explanations. Can you pass?" property="og:description"/><meta content="https://baluraut.github.io/learn-kubernetes-school/images/big-picture-4k.png" property="og:image"/><meta content="website" property="og:type"/><meta content="summary_large_image" name="twitter:card"/>
<style>
:root { --bg:#f8fafc; --card:#fff; --ink:#0f172a; --muted:#475569; --line:#e2e8f0; --accent:#326ce5; --ok:#16a34a; --bad:#dc2626; --blue:#2563eb; }
@media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --card:#131c2e; --ink:#e2e8f0; --muted:#94a3b8; --line:#253349; } }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; line-height:1.6; }
.wrap { max-width:900px; margin:0 auto; padding:28px 20px 60px; }
a { color:var(--blue); } h1 { font-size:1.9rem; }
.sub { color:var(--muted); }
.scorebox { position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; }
.score { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 16px; font-weight:700; }
.qcard { background:var(--card); border:1px solid var(--line); border-left:6px solid var(--accent); border-radius:14px; padding:18px 20px; margin-top:16px; }
.qcard h3 { font-size:1.02rem; margin-bottom:10px; }
.opt { display:block; width:100%; text-align:left; margin-top:8px; padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font:inherit; cursor:pointer; }
.opt:hover { border-color:var(--accent); }
.opt.right { border-color:var(--ok); background:color-mix(in srgb, var(--ok) 12%, var(--bg)); }
.opt.wrong { border-color:var(--bad); background:color-mix(in srgb, var(--bad) 12%, var(--bg)); }
.why { display:none; margin-top:10px; color:var(--muted); font-size:.92rem; border-top:1px dashed var(--line); padding-top:8px; }
.reset { margin-top:20px; background:var(--accent); color:#fff; border:none; border-radius:10px; padding:10px 18px; font:inherit; font-weight:700; cursor:pointer; }
footer { margin-top:44px; border-top:1px solid var(--line); padding-top:16px; color:var(--muted); font-size:.88rem; }
</style>
<style id="i18n-css">
#lang-pick{position:fixed;top:10px;right:10px;z-index:9999;font:600 .85rem -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--card,#fff);color:var(--ink,#0f172a);border:1px solid var(--line,#e2e8f0);border-radius:999px;padding:6px 12px;box-shadow:0 2px 10px rgba(0,0,0,.08);cursor:pointer}
html[lang="mr"] body{font-family:"Noto Sans Devanagari","Mukta","Devanagari Sangam MN","Nirmala UI",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
html[lang="mr"] svg text{font-family:"Noto Sans Devanagari","Mukta","Devanagari Sangam MN","Nirmala UI",sans-serif}
@media print{#lang-pick{display:none}}
</style></head><body><select aria-label="Language / भाषा" id="lang-pick" onchange="schoolSetLang(this.value)">
<option value="mr">🇮🇳 मराठी</option><option value="en">🇬🇧 English</option></select><div class="wrap">
<p data-en='&lt;a href="index.html"&gt;← Back to the course home&lt;/a&gt;'><a href="index.html">← कोर्सच्या मुख्य पानाकडे परत</a></p>
<h1 data-en="🧪 The ☸️ Kubernetes quiz">🧪 ☸️ Kubernetes प्रश्नमंजुषा</h1>
<p class="sub" data-en="10 questions — pick an answer, get the why. One attempt per question (until reset).
Your best score is saved in this browser.">10 प्रश्न — उत्तर निवडा, कारण मिळवा. प्रत्येक प्रश्नाला एकच प्रयत्न (reset पर्यंत). तुमचा सर्वोत्तम गुण या ब्राउझरमध्ये जपला जातो.</p>
<div class="scorebox"><div class="score" data-en="0 / 10 · best: —" id="score">0 / 10 · सर्वोत्तम: —</div></div>
<div id="quiz"></div>
<button class="reset" data-en="↺ Reset &amp;amp; retake" onclick="reset()">↺ Reset &amp; पुन्हा द्या</button>
<footer data-en='Part of &lt;a href="https://baluraut.github.io/school/"&gt;🏫 The School&lt;/a&gt; · &lt;a href="index.html"&gt;course home&lt;/a&gt; ·
  &lt;a href="https://github.com/BaluRaut/learn-kubernetes-school/issues"&gt;🐛 found a mistake?&lt;/a&gt;
'><a href="https://baluraut.github.io/school/">🏫 द स्कूल</a> चा भाग · <a href="index.html">कोर्स मुख्य पान</a> · <a href="https://github.com/BaluRaut/learn-kubernetes-school/issues">🐛 चूक सापडली?</a></footer>
</div>
<script>
var QS = [{"q": "A pod crashes at 3 AM. Who brings it back?", "o": ["The kubelet restarts pods on its own", "The Deployment's ReplicaSet — the class monitor", "Nothing — pods stay dead"], "c": 1, "w": "L03: the monitor counts forever; a lone pod stays dead, a managed one is replaced."}, {"q": "How does a Service know which pods to send traffic to?", "o": ["By pod name", "By label selector — the sticker on the desk", "By IP address list you maintain"], "c": 1, "w": "L04: reception picks by label, and only READY pods (L07)."}, {"q": "Liveness fails repeatedly vs readiness fails — what happens?", "o": ["Both restart the container", "Restart vs removed-from-Service (no restart)", "Both just log a warning"], "c": 1, "w": "L07: two questions, two consequences — mixing them up is the classic mistake."}, {"q": "requests vs limits, in one line?", "o": ["Same thing, two names", "Reservation for scheduling vs hard cap at runtime", "Limits are for CPU only"], "c": 1, "w": "L08: the promised plate vs the seconds cap; RAM over limit = OOMKilled."}, {"q": "The HPA's 70% target is 70% of what?", "o": ["The node's CPU", "The pod's REQUESTED CPU", "The limit"], "c": 1, "w": "L09: requests are the yardstick — another reason to set them honestly."}, {"q": "What makes a rollout zero-downtime?", "o": ["Kubernetes is just fast", "Readiness gates + maxUnavailable: 0 — new pod serves before old leaves", "Restarting at night"], "c": 1, "w": "L11: the referee checks laces before the substitution."}, {"q": "kubectl apply sends your YAML to…", "o": ["Each node directly", "The API server, which records it in etcd", "The scheduler"], "c": 1, "w": "L13: everything goes through the principal; the register is the truth."}, {"q": "A pod is stuck Pending. Most likely?", "o": ["Image bug", "No node fits its requests (or taints repel it)", "Service missing"], "c": 1, "w": "L16+L20: the scheduler found no desk — describe shows exactly why."}, {"q": "What does a PodDisruptionBudget protect against?", "o": ["Crashes", "Voluntary disruptions — drains/upgrades evicting too many at once", "OOMKills"], "c": 1, "w": "L15/L24: never everyone at lunch at once; drains WAIT for it."}, {"q": "Your manifest says replicas: 2 but 5 run and stay. Who's fighting you?", "o": ["A bug", "Another controller — likely the HPA — reconciling its own wish", "etcd corruption"], "c": 1, "w": "L09/L25: controllers reconcile forever; find the other wish before you fight it."}];
var KEY='quiz-pubrepo', answered={}, score=0;
var best = parseInt(localStorage.getItem(KEY)||'-1');
function render() {
  var el = document.getElementById('quiz'); el.innerHTML='';
  QS.forEach(function(q,i) {
    var card=document.createElement('div'); card.className='qcard';
    card.innerHTML='<h3>'+(i+1)+'. '+q.q+'</h3>';
    q.o.forEach(function(opt,j) {
      var b=document.createElement('button'); b.className='opt'; b.textContent=opt;
      b.onclick=function() {
        if (answered[i]!==undefined) return;
        answered[i]=j;
        if (j===q.c) { b.classList.add('right'); score++; }
        else { b.classList.add('wrong'); card.querySelectorAll('.opt')[q.c].classList.add('right'); }
        card.querySelector('.why').style.display='block';
        update();
      };
      card.appendChild(b);
    });
    var why=document.createElement('div'); why.className='why'; why.textContent='💡 '+q.w;
    card.appendChild(why);
    el.appendChild(card);
  });
}
function update() {
  var done=Object.keys(answered).length;
  if (done===QS.length && score>best) { best=score; localStorage.setItem(KEY,best); }
  document.getElementById('score').textContent=score+' / '+QS.length+(done===QS.length?' — done! 🎓':'')+' · best: '+(best<0?'—':best+'/'+QS.length);
}
function reset() { answered={}; score=0; render(); update(); }
render(); update();
</script>
<script id="i18n-js">
function schoolSetLang(l){
  try{localStorage.setItem('school-lang',l)}catch(e){}
  document.documentElement.setAttribute('lang',l);
  document.querySelectorAll('[data-en]').forEach(function(el){
    if(!el.hasAttribute('data-mr')) el.setAttribute('data-mr', el.innerHTML);
    el.innerHTML = (l==='en') ? el.getAttribute('data-en') : el.getAttribute('data-mr');
  });
  document.querySelectorAll('[data-en-ph]').forEach(function(el){
    if(!el.hasAttribute('data-mr-ph')) el.setAttribute('data-mr-ph', el.getAttribute('placeholder'));
    el.setAttribute('placeholder', (l==='en') ? el.getAttribute('data-en-ph') : el.getAttribute('data-mr-ph'));
  });
  var p=document.getElementById('lang-pick'); if(p) p.value=l;
}
(function(){ var l='mr'; try{ l=localStorage.getItem('school-lang')||'mr'; }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){schoolSetLang(l)}); else schoolSetLang(l); })();
</script></body></html>
