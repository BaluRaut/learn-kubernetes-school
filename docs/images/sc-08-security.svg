<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
  <rect width="3840" height="2160" fill="#f8fafc"/>

  <circle cx="180" cy="150" r="60" fill="#dc2626"/><text x="180" y="176" font-size="72" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
  <text x="280" y="180" font-size="76" font-weight="bold" fill="#0f172a">Rate Limits &amp; Security Layers</text>
  <text x="280" y="266" font-size="42" fill="#475569">Defense in depth — each layer assumes the one above failed</text>
  <rect x="100" y="560" width="827" height="460" rx="22" fill="#ffffff" stroke="#d97706" stroke-width="5"/>
  <rect x="100" y="560" width="827" height="80" rx="22" fill="#d97706"/>
  <text x="513" y="614" font-size="33" font-weight="bold" fill="#ffffff" text-anchor="middle">1 · WAF (edge)</text>
  <circle cx="100" cy="560" r="34" fill="#0f172a"/><text x="100" y="573" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">a</text>
  <text x="513" y="710" font-size="31" fill="#334155" text-anchor="middle">SQLi/XSS managed rules</text>
  <text x="513" y="762" font-size="31" fill="#334155" text-anchor="middle">IP throttles</text>
  <text x="513" y="814" font-size="31" fill="#334155" text-anchor="middle">bot control</text>
  <line x1="927" y1="790" x2="1025" y2="790" stroke="#475569" stroke-width="9" marker-end="url(#arr)"/>
  <rect x="1037" y="560" width="827" height="460" rx="22" fill="#ffffff" stroke="#2563eb" stroke-width="5"/>
  <rect x="1037" y="560" width="827" height="80" rx="22" fill="#2563eb"/>
  <text x="1450" y="614" font-size="33" font-weight="bold" fill="#ffffff" text-anchor="middle">2 · App throttles</text>
  <circle cx="1037" cy="560" r="34" fill="#0f172a"/><text x="1037" y="573" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">b</text>
  <text x="1450" y="710" font-size="31" fill="#334155" text-anchor="middle">per user + per LFG</text>
  <text x="1450" y="762" font-size="31" fill="#334155" text-anchor="middle">tight on auth routes</text>
  <text x="1450" y="814" font-size="31" fill="#334155" text-anchor="middle">429 with retry-after</text>
  <line x1="1864" y1="790" x2="1962" y2="790" stroke="#475569" stroke-width="9" marker-end="url(#arr)"/>
  <rect x="1974" y="560" width="827" height="460" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-width="5"/>
  <rect x="1974" y="560" width="827" height="80" rx="22" fill="#7c3aed"/>
  <text x="2387" y="614" font-size="33" font-weight="bold" fill="#ffffff" text-anchor="middle">3 · Input validation</text>
  <circle cx="1974" cy="560" r="34" fill="#0f172a"/><text x="1974" y="573" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">c</text>
  <text x="2387" y="710" font-size="31" fill="#334155" text-anchor="middle">whitelist DTOs (API)</text>
  <text x="2387" y="762" font-size="31" fill="#334155" text-anchor="middle">registry rules (ingest)</text>
  <text x="2387" y="814" font-size="31" fill="#334155" text-anchor="middle">bad rows → reject + worklist</text>
  <line x1="2801" y1="790" x2="2899" y2="790" stroke="#475569" stroke-width="9" marker-end="url(#arr)"/>
  <rect x="2911" y="560" width="827" height="460" rx="22" fill="#ffffff" stroke="#dc2626" stroke-width="5"/>
  <rect x="2911" y="560" width="827" height="80" rx="22" fill="#dc2626"/>
  <text x="3324" y="614" font-size="33" font-weight="bold" fill="#ffffff" text-anchor="middle">4 · Audit log</text>
  <circle cx="2911" cy="560" r="34" fill="#0f172a"/><text x="2911" y="573" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">d</text>
  <text x="3324" y="710" font-size="31" fill="#334155" text-anchor="middle">immutable, append-only</text>
  <text x="3324" y="762" font-size="31" fill="#334155" text-anchor="middle">every mutation + auth event</text>
  <text x="3324" y="814" font-size="31" fill="#334155" text-anchor="middle">who · what · when · where</text>
  <rect x="480" y="1300" width="2880" height="96" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="1920" y="1360" font-size="36" font-weight="bold" fill="#334155" text-anchor="middle">Files parse in sandboxed workers — parsers are a known CVE surface</text>
  <rect x="480" y="1430" width="2880" height="96" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="1920" y="1490" font-size="36" font-weight="bold" fill="#334155" text-anchor="middle">Secrets rotated; nothing sensitive in code, images or env files</text>
  <text x="1920" y="2090" font-size="32" fill="#64748b" text-anchor="middle">LFG Platform · scenario 8 of 10 · RFC v4.1 appendix</text>
</svg>
