<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
  <rect width="3840" height="2160" fill="#f8fafc"/>

  <circle cx="180" cy="150" r="60" fill="#dc2626"/><text x="180" y="176" font-size="72" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <text x="280" y="180" font-size="76" font-weight="bold" fill="#0f172a">API ⟷ Database Connection</text>
  <text x="280" y="266" font-size="42" fill="#475569">From request to exactly one grower's data — nothing else reachable</text>
  <rect x="100" y="560" width="827" height="460" rx="22" fill="#ffffff" stroke="#2563eb" stroke-width="5"/>
  <rect x="100" y="560" width="827" height="80" rx="22" fill="#2563eb"/>
  <text x="513" y="614" font-size="33" font-weight="bold" fill="#ffffff" text-anchor="middle">Request arrives</text>
  <circle cx="100" cy="560" r="34" fill="#0f172a"/><text x="100" y="573" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">a</text>
  <text x="513" y="710" font-size="31" fill="#334155" text-anchor="middle">CB token (identity)</text>
  <text x="513" y="762" font-size="31" fill="#334155" text-anchor="middle">+ /g/&lt;encrypted route&gt;</text>
  <text x="513" y="814" font-size="31" fill="#334155" text-anchor="middle">(which grower)</text>
  <line x1="927" y1="790" x2="1025" y2="790" stroke="#475569" stroke-width="9" marker-end="url(#arr)"/>
  <rect x="1037" y="560" width="827" height="460" rx="22" fill="#ffffff" stroke="#dc2626" stroke-width="5"/>
  <rect x="1037" y="560" width="827" height="80" rx="22" fill="#dc2626"/>
  <text x="1450" y="614" font-size="33" font-weight="bold" fill="#ffffff" text-anchor="middle">Tenant guard</text>
  <circle cx="1037" cy="560" r="34" fill="#0f172a"/><text x="1037" y="573" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">b</text>
  <text x="1450" y="710" font-size="31" fill="#334155" text-anchor="middle">membership check FIRST</text>
  <text x="1450" y="762" font-size="31" fill="#334155" text-anchor="middle">non-member → 403</text>
  <text x="1450" y="814" font-size="31" fill="#334155" text-anchor="middle">before any handler runs</text>
  <line x1="1864" y1="790" x2="1962" y2="790" stroke="#475569" stroke-width="9" marker-end="url(#arr)"/>
  <rect x="1974" y="560" width="827" height="460" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-width="5"/>
  <rect x="1974" y="560" width="827" height="80" rx="22" fill="#7c3aed"/>
  <text x="2387" y="614" font-size="33" font-weight="bold" fill="#ffffff" text-anchor="middle">Persona scope attached</text>
  <circle cx="1974" cy="560" r="34" fill="#0f172a"/><text x="1974" y="573" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">c</text>
  <text x="2387" y="710" font-size="31" fill="#334155" text-anchor="middle">role + data scope loaded</text>
  <text x="2387" y="762" font-size="31" fill="#334155" text-anchor="middle">(cached ≤ 60 s)</text>
  <line x1="2801" y1="790" x2="2899" y2="790" stroke="#475569" stroke-width="9" marker-end="url(#arr)"/>
  <rect x="2911" y="560" width="827" height="460" rx="22" fill="#ffffff" stroke="#16a34a" stroke-width="5"/>
  <rect x="2911" y="560" width="827" height="80" rx="22" fill="#16a34a"/>
  <text x="3324" y="614" font-size="33" font-weight="bold" fill="#ffffff" text-anchor="middle">Pool per LFG</text>
  <circle cx="2911" cy="560" r="34" fill="#0f172a"/><text x="2911" y="573" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">d</text>
  <text x="3324" y="710" font-size="31" fill="#334155" text-anchor="middle">cached connection pool</text>
  <text x="3324" y="762" font-size="31" fill="#334155" text-anchor="middle">bounded + tunable</text>
  <text x="3324" y="814" font-size="31" fill="#334155" text-anchor="middle">only that grower's DB</text>
  <rect x="480" y="1300" width="2880" height="96" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="1920" y="1360" font-size="36" font-weight="bold" fill="#334155" text-anchor="middle">No global pool exists in request code — a cross-silo query is unwritable</text>
  <rect x="480" y="1430" width="2880" height="96" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="1920" y="1490" font-size="36" font-weight="bold" fill="#334155" text-anchor="middle">Pool sizing is load-test configuration, not an architectural commitment</text>
  <text x="1920" y="2090" font-size="32" fill="#64748b" text-anchor="middle">LFG Platform · scenario 7 of 10 · RFC v4.1 appendix</text>
</svg>
