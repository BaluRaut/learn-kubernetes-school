<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="3840" height="2160" fill="#f8fafc"/>

  <text x="120" y="150" font-size="96" font-weight="bold" fill="#0f172a">Kubernetes — Inside the Cluster</text>
  <text x="120" y="240" font-size="48" fill="#475569">What each manifest in k8s/ creates, and how a request travels from the internet to a pod</text>

  <!-- ===================== 1. kubectl ===================== -->
  <rect x="120" y="420" width="560" height="440" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <rect x="120" y="420" width="560" height="90" rx="24" fill="#0f172a"/>
  <text x="400" y="482" font-size="50" font-weight="bold" fill="#ffffff" text-anchor="middle">You / CircleCI</text>
  <text x="400" y="590" font-size="42" font-family="Menlo, monospace" fill="#0f172a" text-anchor="middle">kubectl apply -f k8s/</text>
  <text x="400" y="670" font-size="38" fill="#334155" text-anchor="middle">sends the YAML manifests</text>
  <text x="400" y="725" font-size="38" fill="#334155" text-anchor="middle">(the DESIRED state)</text>
  <text x="400" y="780" font-size="38" fill="#334155" text-anchor="middle">to the cluster's API server</text>
  <circle cx="120" cy="420" r="48" fill="#dc2626"/>
  <text x="120" y="440" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  <!-- arrow kubectl -> control plane -->
  <line x1="680" y1="640" x2="880" y2="640" stroke="#475569" stroke-width="8" marker-end="url(#arrow)"/>

  <!-- control plane -->
  <rect x="900" y="420" width="620" height="440" rx="24" fill="#ffffff" stroke="#326CE5" stroke-width="5"/>
  <rect x="900" y="420" width="620" height="90" rx="24" fill="#326CE5"/>
  <text x="1210" y="482" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">Control plane (EKS-managed)</text>
  <text x="1210" y="590" font-size="38" fill="#334155" text-anchor="middle">API server · scheduler · controllers</text>
  <text x="1210" y="670" font-size="38" fill="#334155" text-anchor="middle">works 24/7 to make reality</text>
  <text x="1210" y="725" font-size="38" fill="#334155" text-anchor="middle">match your YAML —</text>
  <text x="1210" y="795" font-size="40" font-weight="bold" fill="#326CE5" text-anchor="middle">crashed pod? replaced automatically</text>

  <!-- ===================== 2. namespace box ===================== -->
  <rect x="900" y="960" width="2380" height="1080" rx="32" fill="#eff6ff" stroke="#326CE5" stroke-width="6" stroke-dasharray="24 18"/>
  <text x="950" y="1050" font-size="52" font-weight="bold" fill="#1d4ed8">namespace: school</text>
  <circle cx="900" cy="960" r="48" fill="#dc2626"/>
  <text x="900" y="980" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

  <!-- arrow control plane -> namespace -->
  <line x1="1210" y1="860" x2="1210" y2="950" stroke="#475569" stroke-width="8" marker-end="url(#arrow)"/>

  <!-- ===================== 3. Deployment + pods ===================== -->
  <rect x="980" y="1120" width="1180" height="560" rx="24" fill="#ffffff" stroke="#326CE5" stroke-width="5"/>
  <rect x="980" y="1120" width="1180" height="90" rx="24" fill="#326CE5"/>
  <text x="1570" y="1182" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">Deployment: school-api  (replicas: 2)</text>
  <circle cx="980" cy="1120" r="48" fill="#dc2626"/>
  <text x="980" y="1140" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  <!-- pods -->
  <rect x="1040" y="1270" width="330" height="330" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="5"/>
  <text x="1205" y="1340" font-size="42" font-weight="bold" fill="#0f172a" text-anchor="middle">Pod 1</text>
  <text x="1205" y="1400" font-size="34" fill="#334155" text-anchor="middle">container:</text>
  <text x="1205" y="1450" font-size="34" fill="#334155" text-anchor="middle">school-api (ECR)</text>
  <text x="1205" y="1520" font-size="32" fill="#16a34a" text-anchor="middle">/healthz ✓ /readyz ✓</text>

  <rect x="1420" y="1270" width="330" height="330" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="5"/>
  <text x="1585" y="1340" font-size="42" font-weight="bold" fill="#0f172a" text-anchor="middle">Pod 2</text>
  <text x="1585" y="1400" font-size="34" fill="#334155" text-anchor="middle">container:</text>
  <text x="1585" y="1450" font-size="34" fill="#334155" text-anchor="middle">school-api (ECR)</text>
  <text x="1585" y="1520" font-size="32" fill="#16a34a" text-anchor="middle">/healthz ✓ /readyz ✓</text>

  <rect x="1800" y="1270" width="330" height="330" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="1965" y="1340" font-size="42" font-weight="bold" fill="#64748b" text-anchor="middle">Pod 3…5</text>
  <text x="1965" y="1410" font-size="34" fill="#64748b" text-anchor="middle">created by HPA</text>
  <text x="1965" y="1460" font-size="34" fill="#64748b" text-anchor="middle">under load</text>

  <!-- 5. probes badge on pods -->
  <circle cx="1040" cy="1600" r="48" fill="#dc2626"/>
  <text x="1040" y="1620" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="1100" y="1618" font-size="34" fill="#334155">liveness + readiness probes</text>

  <!-- ===================== 4. ConfigMap + Secret ===================== -->
  <rect x="2260" y="1120" width="920" height="270" rx="24" fill="#ffffff" stroke="#d97706" stroke-width="5"/>
  <rect x="2260" y="1120" width="920" height="90" rx="24" fill="#d97706"/>
  <text x="2720" y="1182" font-size="46" font-weight="bold" fill="#ffffff" text-anchor="middle">ConfigMap + Secret</text>
  <text x="2720" y="1280" font-size="36" fill="#334155" text-anchor="middle">config lives OUTSIDE the image:</text>
  <text x="2720" y="1340" font-size="36" fill="#334155" text-anchor="middle">PORT, APP_VERSION  ·  DATABASE_URL (secret)</text>
  <circle cx="2260" cy="1120" r="48" fill="#dc2626"/>
  <text x="2260" y="1140" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <line x1="2260" y1="1300" x2="2170" y2="1300" stroke="#d97706" stroke-width="8" stroke-dasharray="18 12" marker-end="url(#arrow)"/>

  <!-- ===================== 8. HPA ===================== -->
  <rect x="2260" y="1440" width="920" height="240" rx="24" fill="#ffffff" stroke="#7c3aed" stroke-width="5"/>
  <text x="2720" y="1530" font-size="44" font-weight="bold" fill="#0f172a" text-anchor="middle">HorizontalPodAutoscaler</text>
  <text x="2720" y="1600" font-size="36" fill="#334155" text-anchor="middle">CPU &gt; 70%  →  add pods (max 5)</text>
  <text x="2720" y="1655" font-size="36" fill="#334155" text-anchor="middle">load drops  →  shrink back (min 2)</text>
  <circle cx="2260" cy="1440" r="48" fill="#dc2626"/>
  <text x="2260" y="1460" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
  <line x1="2260" y1="1560" x2="2140" y2="1470" stroke="#7c3aed" stroke-width="8" stroke-dasharray="18 12" marker-end="url(#arrow)"/>

  <!-- ===================== 6. Service ===================== -->
  <rect x="1170" y="1780" width="800" height="200" rx="24" fill="#ffffff" stroke="#326CE5" stroke-width="5"/>
  <text x="1570" y="1860" font-size="44" font-weight="bold" fill="#0f172a" text-anchor="middle">Service: school-api  (ClusterIP)</text>
  <text x="1570" y="1930" font-size="36" fill="#334155" text-anchor="middle">port 80 → pod port 3000 · picks only READY pods</text>
  <circle cx="1170" cy="1780" r="48" fill="#dc2626"/>
  <text x="1170" y="1800" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <line x1="1570" y1="1780" x2="1570" y2="1610" stroke="#475569" stroke-width="8" marker-end="url(#arrow)"/>

  <!-- ===================== 7. Ingress / ALB + users ===================== -->
  <rect x="2500" y="420" width="780" height="440" rx="24" fill="#ffffff" stroke="#FF9900" stroke-width="5"/>
  <rect x="2500" y="420" width="780" height="90" rx="24" fill="#FF9900"/>
  <text x="2890" y="482" font-size="50" font-weight="bold" fill="#ffffff" text-anchor="middle">Ingress → AWS ALB</text>
  <text x="2890" y="590" font-size="38" fill="#334155" text-anchor="middle">the ingress.yaml manifest makes AWS</text>
  <text x="2890" y="645" font-size="38" fill="#334155" text-anchor="middle">create a real Application Load Balancer</text>
  <text x="2890" y="720" font-size="38" fill="#334155" text-anchor="middle">internet traffic enters here, then:</text>
  <text x="2890" y="790" font-size="40" font-weight="bold" fill="#0f172a" text-anchor="middle">ALB → Service → a ready Pod</text>
  <circle cx="2500" cy="420" r="48" fill="#dc2626"/>
  <text x="2500" y="440" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>

  <!-- users -->
  <rect x="3460" y="530" width="300" height="220" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="3610" y="620" font-size="44" font-weight="bold" fill="#0f172a" text-anchor="middle">Users</text>
  <text x="3610" y="685" font-size="34" fill="#334155" text-anchor="middle">HTTP requests</text>
  <line x1="3460" y1="640" x2="3300" y2="640" stroke="#475569" stroke-width="8" marker-end="url(#arrow)"/>

  <!-- arrow ALB -> service -->
  <polyline points="2890,860 2890,915 3230,915 3230,1880 1990,1880" fill="none" stroke="#FF9900" stroke-width="8" marker-end="url(#arrow)"/>
  <text x="2600" y="1940" font-size="36" fill="#b45309">routes to the Service</text>
</svg>
