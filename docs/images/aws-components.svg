<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1240" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .req  { fill: #fff; stroke: #326ce5; stroke-width: 2.5; }
    .opt  { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 8 6; }
    .zone { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
    .inner{ fill: #fff; stroke: #94a3b8; stroke-width: 1.5; }
    .pod  { fill: #eef2ff; stroke: #326ce5; stroke-width: 1.2; }
    .title { font-size: 36px; font-weight: 800; fill: #0f172a; }
    .t  { font-size: 19px; font-weight: 600; fill: #0f172a; }
    .s  { font-size: 14.5px; fill: #475569; }
    .z  { font-size: 16px; font-weight: 700; fill: #64748b; }
    .m  { text-anchor: middle; }
    .arr  { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arw); }
    .dash { stroke-dasharray: 8 7; }
    .badge-r { fill: #2563eb; }
    .badge-o { fill: #f59e0b; }
    .bt { font-size: 13px; font-weight: 800; fill: #fff; text-anchor: middle; }
    .nc { fill: #326ce5; }
    .ntb { font-size: 15px; font-weight: 700; fill: #fff; text-anchor: middle; }
  </style>

  <rect x="0" y="0" width="1920" height="1240" fill="#ffffff"/>
  <text class="title m" x="960" y="50">☸️ on ☁️ — every AWS component under the cluster: purpose · required or optional</text>
  <rect class="badge-r" x="640" y="70" width="100" height="28" rx="14"/><text class="bt" x="690" y="89">REQUIRED</text>
  <text class="s" x="750" y="89">= the cluster won't work without it</text>
  <rect class="badge-o" x="1070" y="70" width="100" height="28" rx="14"/><text class="bt" x="1120" y="89">OPTIONAL</text>
  <text class="s" x="1180" y="89">= feature-driven — add when you need the feature</text>

  <!-- internet + ALB -->
  <rect class="req" x="40" y="130" width="190" height="100" rx="14"/>
  <text class="t m" x="135" y="170">🌍 internet</text>
  <text class="s m" x="135" y="196">parents' browsers</text>

  <rect class="opt" x="290" y="130" width="360" height="100" rx="14"/>
  <rect class="badge-o" x="540" y="118" width="100" height="28" rx="14"/><text class="bt" x="590" y="137">OPTIONAL</text>
  <text class="t m" x="470" y="165">🏫 ALB — the one HTTP gate</text>
  <text class="s m" x="470" y="191">built by the LB Controller from your Ingress</text>
  <text class="s m" x="470" y="212">(k8s lesson 10) · ~$20/mo · skip = no public web door</text>
  <line class="arr" x1="230" y1="180" x2="286" y2="180"/>
  <g transform="translate(258,160)"><circle r="13" class="nc"/><text class="ntb" dy="5">1</text></g>

  <!-- EKS control plane -->
  <rect class="req" x="1440" y="130" width="440" height="240" rx="16"/>
  <rect class="badge-r" x="1770" y="118" width="100" height="28" rx="14"/><text class="bt" x="1820" y="137">REQUIRED</text>
  <text class="t m" x="1660" y="168">🏢 EKS control plane</text>
  <text class="s m" x="1660" y="196">the school office, run BY AWS:</text>
  <text class="s m" x="1660" y="218">API server · etcd 📖 · scheduler · controllers</text>
  <text class="s m" x="1660" y="246">you never see these machines —</text>
  <text class="s m" x="1660" y="268">that's what the $73/month buys</text>
  <text class="s m" x="1660" y="296">purpose: the brain — stores your wishes,</text>
  <text class="s m" x="1660" y="318">assigns pods to desks (terraform/eks.tf)</text>

  <!-- VPC -->
  <rect class="req" x="40" y="280" width="1340" height="560" rx="18"/>
  <rect class="badge-r" x="1270" y="268" width="100" height="28" rx="14"/><text class="bt" x="1320" y="287">REQUIRED</text>
  <text class="t" x="70" y="318">🏞️ VPC — your private campus network (terraform/vpc.tf) · purpose: nothing touches your desks except through doors YOU define</text>

  <!-- public subnets -->
  <rect class="zone" x="70" y="340" width="1280" height="150" rx="12"/>
  <text class="z" x="90" y="368">public subnets — rooms with street-facing windows</text>
  <rect class="req" x="90" y="384" width="290" height="90" rx="12"/>
  <rect class="badge-r" x="270" y="372" width="100" height="28" rx="14"/><text class="bt" x="320" y="391">REQUIRED</text>
  <text class="t m" x="235" y="416">🚪 internet gateway</text>
  <text class="s m" x="235" y="440">purpose: the campus gate —</text>
  <text class="s m" x="235" y="460">without it, no in/out at all</text>
  <rect class="req" x="410" y="384" width="380" height="90" rx="12"/>
  <rect class="badge-r" x="680" y="372" width="100" height="28" rx="14"/><text class="bt" x="730" y="391">REQUIRED</text>
  <text class="t m" x="600" y="416">📤 NAT gateway</text>
  <text class="s m" x="600" y="440">purpose: private desks can call OUT (pull images,</text>
  <text class="s m" x="600" y="460">updates) but nobody calls IN · ~$32/mo — the sneaky bill line</text>
  <rect class="opt" x="820" y="384" width="330" height="90" rx="12"/>
  <text class="s m" x="985" y="420">🏫 (the ALB physically lives here,</text>
  <text class="s m" x="985" y="442">in the public rooms, when you add it)</text>

  <!-- private subnets -->
  <rect class="zone" x="70" y="510" width="1280" height="310" rx="12"/>
  <text class="z" x="90" y="538">private subnets — no street windows at all: the safe rooms</text>

  <rect class="req" x="100" y="556" width="770" height="240" rx="14"/>
  <rect class="badge-r" x="760" y="544" width="100" height="28" rx="14"/><text class="bt" x="810" y="563">REQUIRED</text>
  <text class="t m" x="485" y="590">👯 EKS node group = an Auto Scaling Group of EC2 desks (terraform/eks.tf)</text>
  <rect class="inner" x="130" y="610" width="340" height="160" rx="12"/>
  <text class="t m" x="300" y="640">🖥️ EC2 node — t3.small</text>
  <text class="s m" x="300" y="663">runs the kubelet 🧑‍🏫 (k8s lesson 13)</text>
  <rect class="pod" x="150" y="680" width="140" height="60" rx="8"/>
  <text class="s m" x="220" y="705">🪑 pods:</text>
  <text class="s m" x="220" y="725">school-api ×2</text>
  <rect class="pod" x="305" y="680" width="140" height="60" rx="8"/>
  <text class="s m" x="375" y="705">🪑 pods:</text>
  <text class="s m" x="375" y="725">analytics ×2</text>
  <rect class="inner" x="500" y="610" width="340" height="160" rx="12" stroke-dasharray="8 6"/>
  <text class="t m" x="670" y="640">🖥️ EC2 node #2, #3…</text>
  <text class="s m" x="670" y="668">the ASG adds/replaces desks;</text>
  <text class="s m" x="670" y="690">cluster autoscaler asks for more</text>
  <text class="s m" x="670" y="712">when pods no longer fit</text>
  <text class="s m" x="670" y="740">(HPA adds pods → ASG adds desks)</text>
  <g transform="translate(100,556)"><circle r="13" class="nc"/><text class="ntb" dy="5">2</text></g>

  <rect class="req" x="900" y="556" width="430" height="110" rx="12"/>
  <rect class="badge-r" x="1220" y="544" width="100" height="28" rx="14"/><text class="bt" x="1270" y="563">REQUIRED</text>
  <text class="t m" x="1115" y="590">🧍 security groups</text>
  <text class="s m" x="1115" y="614">purpose: gatekeepers EKS wires for you —</text>
  <text class="s m" x="1115" y="636">office ↔ desks · ALB → pods · nothing else</text>

  <rect class="opt" x="900" y="690" width="430" height="106" rx="12"/>
  <rect class="badge-o" x="1220" y="678" width="100" height="28" rx="14"/><text class="bt" x="1270" y="697">OPTIONAL</text>
  <text class="t m" x="1115" y="722">🗄️ EBS volumes</text>
  <text class="s m" x="1115" y="746">purpose: drawers for PVCs (k8s lesson 12) —</text>
  <text class="s m" x="1115" y="768">only if you keep state IN the cluster (this repo: stateless)</text>

  <!-- arrows top -->
  <line class="arr" x1="470" y1="230" x2="470" y2="336"/>
  <line class="arr" x1="470" y1="490" x2="470" y2="552"/>
  <g transform="translate(447,515)"><circle r="13" class="nc"/><text class="ntb" dy="5">3</text></g>
  <text class="s" x="490" y="520">requests reach the pods</text>
  <line class="arr dash" x1="1440" y1="290" x2="875" y2="600"/>
  <g transform="translate(1048,505)"><circle r="13" class="nc"/><text class="ntb" dy="5">4</text></g>
  <text class="s m" x="1150" y="540">office ↔ kubelet: commands down, status up</text>

  <!-- bottom row -->
  <rect class="req" x="40" y="880" width="350" height="150" rx="14"/>
  <rect class="badge-r" x="280" y="868" width="100" height="28" rx="14"/><text class="bt" x="330" y="887">REQUIRED</text>
  <text class="t m" x="215" y="914">🎩 IAM roles</text>
  <text class="s m" x="215" y="940">purpose: the hats — cluster role +</text>
  <text class="s m" x="215" y="962">node role: join the cluster, pull from ECR,</text>
  <text class="s m" x="215" y="984">write logs — zero passwords anywhere</text>
  <text class="s m" x="215" y="1010">(the AWS course, lessons 04–05)</text>

  <rect class="req" x="420" y="880" width="350" height="150" rx="14"/>
  <rect class="badge-r" x="660" y="868" width="100" height="28" rx="14"/><text class="bt" x="710" y="887">REQUIRED</text>
  <text class="t m" x="595" y="914">🏦 ECR ×2</text>
  <text class="s m" x="595" y="940">purpose: the image warehouse —</text>
  <text class="s m" x="595" y="962">CI pushes school-api &amp; analytics,</text>
  <text class="s m" x="595" y="984">desks pull at deploy (terraform/ecr.tf)</text>
  <text class="s m" x="595" y="1010">(required for THIS pipeline; swappable)</text>
  <g transform="translate(420,880)"><circle r="13" class="nc"/><text class="ntb" dy="5">5</text></g>

  <rect class="opt" x="800" y="880" width="350" height="150" rx="14"/>
  <rect class="badge-o" x="1040" y="868" width="100" height="28" rx="14"/><text class="bt" x="1090" y="887">OPTIONAL</text>
  <text class="t m" x="975" y="914">📚 RDS Postgres</text>
  <text class="s m" x="975" y="940">purpose: the rented library — managed</text>
  <text class="s m" x="975" y="962">database outside the cluster (lesson 12);</text>
  <text class="s m" x="975" y="984">this repo: create_rds flag, default OFF —</text>
  <text class="s m" x="975" y="1010">app falls back to in-memory mode</text>
  <g transform="translate(800,880)"><circle r="13" class="nc"/><text class="ntb" dy="5">6</text></g>

  <rect class="opt" x="1180" y="880" width="340" height="150" rx="14"/>
  <rect class="badge-o" x="1410" y="868" width="100" height="28" rx="14"/><text class="bt" x="1460" y="887">OPTIONAL</text>
  <text class="t m" x="1350" y="914">📈 CloudWatch</text>
  <text class="s m" x="1350" y="940">purpose: logs &amp; metrics off the desks —</text>
  <text class="s m" x="1350" y="962">container logs, node health, alarms;</text>
  <text class="s m" x="1350" y="984">start without it, add before production</text>

  <rect class="opt" x="1550" y="880" width="330" height="150" rx="14"/>
  <rect class="badge-o" x="1770" y="868" width="100" height="28" rx="14"/><text class="bt" x="1820" y="887">OPTIONAL</text>
  <text class="t m" x="1715" y="914">🪧 Route 53</text>
  <text class="s m" x="1715" y="940">purpose: the school's street name —</text>
  <text class="s m" x="1715" y="962">yourapp.com → the ALB; skip it and</text>
  <text class="s m" x="1715" y="984">use the ALB's ugly DNS name for free</text>

  <line class="arr" x1="595" y1="876" x2="520" y2="800"/>
  <line class="arr dash" x1="975" y1="876" x2="700" y2="800"/>

  <!-- summary -->
  <rect class="zone" x="40" y="1070" width="1840" height="120" rx="14"/>
  <text class="t m" x="960" y="1110">🧮 the minimum viable cluster = VPC + subnets + gateways + EKS control plane + node group (EC2) + IAM roles + ECR</text>
  <text class="s m" x="960" y="1140">≈ $73 (office) + ~$30 (2× t3.small desks) + ~$32 (NAT) per month — everything amber is feature-driven: add the ALB for public web,</text>
  <text class="s m" x="960" y="1162">RDS for real data, EBS for in-cluster state, CloudWatch for eyes, Route 53 for a pretty name · and ALWAYS terraform destroy after playing 🧹</text>
</svg>
