<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="3840" height="2160" fill="#f8fafc"/>

  <text x="120" y="150" font-size="96" font-weight="bold" fill="#0f172a">Docker — Package Once, Run Anywhere</text>
  <text x="120" y="240" font-size="48" fill="#475569">Left: how one image is built and run  ·  Right: docker-compose running the API + Postgres together</text>

  <!-- ===================== LEFT: build flow ===================== -->

  <!-- 1. Dockerfile -->
  <rect x="120" y="420" width="620" height="500" rx="24" fill="#ffffff" stroke="#2496ED" stroke-width="5"/>
  <rect x="120" y="420" width="620" height="90" rx="24" fill="#2496ED"/>
  <text x="430" y="482" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle">Dockerfile  (the recipe)</text>
  <text x="170" y="590" font-size="40" fill="#0f172a" font-family="Menlo, monospace">FROM node:20-alpine</text>
  <text x="170" y="655" font-size="40" fill="#0f172a" font-family="Menlo, monospace">COPY package.json .</text>
  <text x="170" y="720" font-size="40" fill="#0f172a" font-family="Menlo, monospace">RUN npm install</text>
  <text x="170" y="785" font-size="40" fill="#0f172a" font-family="Menlo, monospace">COPY src ./src</text>
  <text x="170" y="850" font-size="35" fill="#0f172a" font-family="Menlo, monospace">CMD ["node","server.js"]</text>
  <circle cx="120" cy="420" r="48" fill="#dc2626"/>
  <text x="120" y="440" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  <!-- 2. docker build arrow -->
  <line x1="430" y1="920" x2="430" y2="1060" stroke="#475569" stroke-width="8" marker-end="url(#arrow)"/>
  <text x="470" y="1005" font-size="44" font-weight="bold" fill="#2496ED">docker build</text>
  <circle cx="380" cy="990" r="48" fill="#dc2626"/>
  <text x="380" y="1010" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

  <!-- 3. Image (layers) -->
  <rect x="120" y="1080" width="620" height="440" rx="24" fill="#ffffff" stroke="#2496ED" stroke-width="5"/>
  <rect x="120" y="1080" width="620" height="90" rx="24" fill="#2496ED"/>
  <text x="430" y="1142" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle">Image  (read-only)</text>
  <rect x="180" y="1210" width="500" height="70" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="3"/>
  <text x="430" y="1258" font-size="36" fill="#0f172a" text-anchor="middle">layer: OS + Node runtime</text>
  <rect x="180" y="1295" width="500" height="70" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="3"/>
  <text x="430" y="1343" font-size="36" fill="#0f172a" text-anchor="middle">layer: node_modules (cached!)</text>
  <rect x="180" y="1380" width="500" height="70" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="3"/>
  <text x="430" y="1428" font-size="36" fill="#0f172a" text-anchor="middle">layer: your app code</text>
  <circle cx="120" cy="1080" r="48" fill="#dc2626"/>
  <text x="120" y="1100" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  <!-- 4. docker run arrow -->
  <line x1="740" y1="1300" x2="920" y2="1300" stroke="#475569" stroke-width="8" marker-end="url(#arrow)"/>
  <text x="830" y="1250" font-size="44" font-weight="bold" fill="#2496ED" text-anchor="middle">docker run</text>
  <circle cx="830" cy="1360" r="48" fill="#dc2626"/>
  <text x="830" y="1380" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>

  <!-- Container -->
  <rect x="940" y="1080" width="620" height="440" rx="24" fill="#ffffff" stroke="#16a34a" stroke-width="5"/>
  <rect x="940" y="1080" width="620" height="90" rx="24" fill="#16a34a"/>
  <text x="1250" y="1142" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle">Container  (running)</text>
  <text x="1250" y="1260" font-size="40" fill="#334155" text-anchor="middle">a live process started</text>
  <text x="1250" y="1320" font-size="40" fill="#334155" text-anchor="middle">from the image — isolated</text>
  <text x="1250" y="1380" font-size="40" fill="#334155" text-anchor="middle">filesystem, network, CPU/RAM</text>
  <text x="1250" y="1460" font-size="40" font-weight="bold" fill="#16a34a" text-anchor="middle">delete it, run it again — same result</text>

  <!-- 5. port mapping -->
  <polyline points="1250,1600 1250,1740" fill="none" stroke="#475569" stroke-width="8" marker-start="url(#arrow)"/>
  <rect x="940" y="1760" width="620" height="200" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="1250" y="1840" font-size="42" font-weight="bold" fill="#0f172a" text-anchor="middle">Your browser</text>
  <text x="1250" y="1905" font-size="40" fill="#334155" text-anchor="middle">localhost:3000 → container:3000</text>
  <circle cx="940" cy="1760" r="48" fill="#dc2626"/>
  <text x="940" y="1780" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>

  <!-- ===================== RIGHT: docker-compose ===================== -->

  <!-- 6. compose network box -->
  <rect x="1980" y="420" width="1740" height="1540" rx="32" fill="#eff6ff" stroke="#2496ED" stroke-width="6" stroke-dasharray="24 18"/>
  <text x="2030" y="510" font-size="54" font-weight="bold" fill="#1d4ed8">docker compose up  —  private network "school"</text>
  <circle cx="1980" cy="420" r="48" fill="#dc2626"/>
  <text x="1980" y="440" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>

  <!-- api service -->
  <rect x="2080" y="620" width="680" height="560" rx="24" fill="#ffffff" stroke="#2496ED" stroke-width="5"/>
  <rect x="2080" y="620" width="680" height="90" rx="24" fill="#2496ED"/>
  <text x="2420" y="682" font-size="50" font-weight="bold" fill="#ffffff" text-anchor="middle">service: api</text>
  <text x="2420" y="790" font-size="40" fill="#334155" text-anchor="middle">built from</text>
  <text x="2420" y="850" font-size="40" font-weight="bold" fill="#0f172a" text-anchor="middle">apps/school-api/Dockerfile</text>
  <text x="2420" y="940" font-size="40" fill="#334155" text-anchor="middle">ports: "3000:3000"</text>
  <text x="2420" y="1030" font-size="38" fill="#334155" text-anchor="middle">DATABASE_URL =</text>
  <text x="2420" y="1090" font-size="38" font-family="Menlo, monospace" fill="#0f172a" text-anchor="middle">postgres://…@db:5432/school</text>

  <!-- db service -->
  <rect x="2960" y="620" width="680" height="560" rx="24" fill="#ffffff" stroke="#336791" stroke-width="5"/>
  <rect x="2960" y="620" width="680" height="90" rx="24" fill="#336791"/>
  <text x="3300" y="682" font-size="50" font-weight="bold" fill="#ffffff" text-anchor="middle">service: db</text>
  <text x="3300" y="790" font-size="40" fill="#334155" text-anchor="middle">image: postgres:16-alpine</text>
  <text x="3300" y="880" font-size="40" fill="#334155" text-anchor="middle">healthcheck: pg_isready</text>
  <text x="3300" y="970" font-size="40" fill="#334155" text-anchor="middle">api waits until healthy</text>
  <text x="3300" y="1060" font-size="40" fill="#334155" text-anchor="middle">(depends_on)</text>

  <!-- arrow api -> db with DNS note -->
  <line x1="2760" y1="900" x2="2960" y2="900" stroke="#475569" stroke-width="8" marker-end="url(#arrow)"/>
  <text x="2860" y="860" font-size="36" fill="#64748b" text-anchor="middle">"db" = DNS name</text>

  <!-- 7. volume -->
  <rect x="2960" y="1360" width="680" height="380" rx="24" fill="#ffffff" stroke="#d97706" stroke-width="5"/>
  <rect x="2960" y="1360" width="680" height="90" rx="24" fill="#d97706"/>
  <text x="3300" y="1422" font-size="50" font-weight="bold" fill="#ffffff" text-anchor="middle">volume: school-data</text>
  <text x="3300" y="1530" font-size="40" fill="#334155" text-anchor="middle">containers are throwaway,</text>
  <text x="3300" y="1590" font-size="40" fill="#334155" text-anchor="middle">volumes are not — your data</text>
  <text x="3300" y="1650" font-size="40" fill="#334155" text-anchor="middle">survives restarts and rebuilds</text>
  <circle cx="2960" cy="1360" r="48" fill="#dc2626"/>
  <text x="2960" y="1380" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <line x1="3300" y1="1180" x2="3300" y2="1350" stroke="#d97706" stroke-width="8" stroke-dasharray="18 12" marker-end="url(#arrow)"/>
  <text x="3420" y="1280" font-size="36" fill="#b45309" text-anchor="middle">writes data to</text>

  <!-- compose command note -->
  <rect x="2080" y="1360" width="680" height="380" rx="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="4"/>
  <text x="2420" y="1450" font-size="44" font-weight="bold" fill="#0f172a" text-anchor="middle">One command:</text>
  <text x="2420" y="1550" font-size="44" font-family="Menlo, monospace" fill="#0f172a" text-anchor="middle">docker compose up --build</text>
  <text x="2420" y="1650" font-size="38" fill="#334155" text-anchor="middle">starts BOTH containers, the network,</text>
  <text x="2420" y="1705" font-size="38" fill="#334155" text-anchor="middle">and the volume — in the right order</text>
</svg>
