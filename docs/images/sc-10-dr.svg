  <text x="2387" y="710" font-size="31" fill="#334155" text-anchor="middle">runbook: IaC rebuild +</text>
  <text x="2387" y="762" font-size="31" fill="#334155" text-anchor="middle">cross-region ECR/S3 replicas</text>
  <text x="2387" y="814" font-size="31" fill="#334155" text-anchor="middle">+ PG backups — RTO &lt; 4 h</text>
