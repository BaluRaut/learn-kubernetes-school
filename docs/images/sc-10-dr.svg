  <text x="1450" y="710" font-size="31" fill="#334155" text-anchor="middle">restore ONE database</text>
  <text x="1450" y="762" font-size="31" fill="#334155" text-anchor="middle">PITR or hourly backup</text>
  <text x="1450" y="814" font-size="31" fill="#334155" text-anchor="middle">repoint registry — &lt; 1 h</text>
