  <text x="3324" y="614" font-size="33" font-weight="bold" fill="#ffffff" text-anchor="middle">Everyone else</text>
  <circle cx="2911" cy="560" r="34" fill="#0f172a"/><text x="2911" y="573" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">d</text>
  <text x="3324" y="710" font-size="31" fill="#334155" text-anchor="middle">other growers unaffected</text>
  <text x="3324" y="762" font-size="31" fill="#334155" text-anchor="middle">at every rung of the ladder</text>
  <text x="3324" y="814" font-size="31" fill="#334155" text-anchor="middle">(isolation pays off here)</text>
