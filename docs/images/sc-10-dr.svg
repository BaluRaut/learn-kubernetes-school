  <text x="280" y="180" font-size="76" font-weight="bold" fill="#0f172a">Disaster Recovery — One Grower, Real Production</text>
  <text x="280" y="266" font-size="42" fill="#475569">Blast-radius ladder: from a bad file to a lost region</text>
  <rect x="100" y="560" width="827" height="460" rx="22" fill="#ffffff" stroke="#d97706" stroke-width="5"/>
