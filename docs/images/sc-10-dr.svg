  <text x="513" y="710" font-size="31" fill="#334155" text-anchor="middle">rollback by batch_id</text>
  <text x="513" y="762" font-size="31" fill="#334155" text-anchor="middle">FK-safe, no orphans</text>
  <text x="513" y="814" font-size="31" fill="#334155" text-anchor="middle">seconds</text>
