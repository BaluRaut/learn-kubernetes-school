<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="3840" height="2160" fill="#f8fafc"/>

  <text x="120" y="150" font-size="96" font-weight="bold" fill="#0f172a">CircleCI — From git push to Production</text>
  <text x="120" y="240" font-size="48" fill="#475569">The pipeline defined in .circleci/config.yml — every box is a job, credentials come from your AWS context</text>

  <!-- ===================== 1. push ===================== -->
  <rect x="120" y="480" width="520" height="360" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <rect x="120" y="480" width="520" height="90" rx="24" fill="#24292f"/>
  <text x="380" y="542" font-size="50" font-weight="bold" fill="#ffffff" text-anchor="middle">git push</text>
  <text x="380" y="650" font-size="40" fill="#334155" text-anchor="middle">any branch → tests run</text>
  <text x="380" y="715" font-size="40" fill="#334155" text-anchor="middle">main branch → tests +</text>
  <text x="380" y="780" font-size="40" fill="#334155" text-anchor="middle">build + deploy</text>
  <circle cx="120" cy="480" r="48" fill="#dc2626"/>
  <text x="120" y="500" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  <!-- 2. webhook -->
  <line x1="640" y1="660" x2="840" y2="660" stroke="#475569" stroke-width="8" marker-end="url(#arrow)"/>
  <text x="740" y="610" font-size="36" fill="#64748b" text-anchor="middle">webhook</text>
  <circle cx="740" cy="720" r="48" fill="#dc2626"/>
  <text x="740" y="740" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

  <!-- ===================== CircleCI boundary ===================== -->
  <rect x="860" y="360" width="2860" height="1280" rx="32" fill="#f1f5f9" stroke="#343434" stroke-width="6"/>
  <text x="910" y="450" font-size="54" font-weight="bold" fill="#343434">CircleCI pipeline</text>

  <!-- 3. context -->
  <rect x="2280" y="390" width="1400" height="150" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
  <text x="2980" y="455" font-size="40" font-weight="bold" fill="#92400e" text-anchor="middle">context: aws  (org-level secrets, injected into every job)</text>
  <text x="2980" y="510" font-size="28" font-family="Menlo, monospace" fill="#92400e" text-anchor="middle">AWS_ACCESS_KEY_ID · AWS_SECRET_ACCESS_KEY · AWS_ACCOUNT_ID · AWS_DEFAULT_REGION</text>
  <circle cx="2280" cy="390" r="48" fill="#dc2626"/>
  <text x="2280" y="410" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  <!-- 4. test job -->
  <rect x="940" y="620" width="620" height="520" rx="24" fill="#ffffff" stroke="#16a34a" stroke-width="5"/>
  <rect x="940" y="620" width="620" height="90" rx="24" fill="#16a34a"/>
  <text x="1250" y="682" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">job: test</text>
  <text x="1250" y="790" font-size="38" fill="#334155" text-anchor="middle">runs in a Node 20 container</text>
  <text x="1250" y="870" font-size="40" font-family="Menlo, monospace" fill="#0f172a" text-anchor="middle">npm ci</text>
  <text x="1250" y="940" font-size="40" font-family="Menlo, monospace" fill="#0f172a" text-anchor="middle">npm test</text>
  <text x="1250" y="1040" font-size="36" fill="#16a34a" text-anchor="middle">fail here → pipeline stops,</text>
  <text x="1250" y="1090" font-size="36" fill="#16a34a" text-anchor="middle">nothing ships broken</text>
  <circle cx="940" cy="620" r="48" fill="#dc2626"/>
  <text x="940" y="640" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>

  <!-- arrow test -> build -->
  <line x1="1560" y1="880" x2="1760" y2="880" stroke="#475569" stroke-width="8" marker-end="url(#arrow)"/>
  <text x="1660" y="830" font-size="34" fill="#64748b" text-anchor="middle">main only</text>

  <!-- 5. build job -->
  <rect x="1780" y="620" width="680" height="520" rx="24" fill="#ffffff" stroke="#2496ED" stroke-width="5"/>
  <rect x="1780" y="620" width="680" height="90" rx="24" fill="#2496ED"/>
  <text x="2120" y="682" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">job: build-and-push</text>
  <text x="2120" y="790" font-size="38" fill="#334155" text-anchor="middle">log in to ECR with context creds</text>
  <text x="2120" y="870" font-size="38" font-family="Menlo, monospace" fill="#0f172a" text-anchor="middle">docker build</text>
  <text x="2120" y="950" font-size="38" font-family="Menlo, monospace" fill="#0f172a" text-anchor="middle">docker push  →  ECR</text>
  <text x="2120" y="1040" font-size="36" fill="#2496ED" text-anchor="middle">image tag = git commit SHA</text>
  <text x="2120" y="1090" font-size="36" fill="#2496ED" text-anchor="middle">(every deploy is traceable)</text>
  <circle cx="1780" cy="620" r="48" fill="#dc2626"/>
  <text x="1780" y="640" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>

  <!-- arrow build -> hold -->
  <line x1="2460" y1="880" x2="2660" y2="880" stroke="#475569" stroke-width="8" marker-end="url(#arrow)"/>

  <!-- 6. hold -->
  <rect x="2680" y="700" width="400" height="360" rx="24" fill="#fef3c7" stroke="#d97706" stroke-width="5"/>
  <text x="2880" y="800" font-size="44" font-weight="bold" fill="#92400e" text-anchor="middle">hold</text>
  <text x="2880" y="880" font-size="36" fill="#92400e" text-anchor="middle">a human clicks</text>
  <text x="2880" y="940" font-size="36" fill="#92400e" text-anchor="middle">"Approve" in the</text>
  <text x="2880" y="1000" font-size="36" fill="#92400e" text-anchor="middle">CircleCI UI</text>
  <circle cx="2680" cy="700" r="48" fill="#dc2626"/>
  <text x="2680" y="720" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>

  <!-- arrow hold -> deploy -->
  <line x1="3080" y1="880" x2="3280" y2="880" stroke="#475569" stroke-width="8" marker-end="url(#arrow)"/>

  <!-- 7. deploy job -->
  <rect x="3300" y="620" width="380" height="520" rx="24" fill="#ffffff" stroke="#326CE5" stroke-width="5"/>
  <rect x="3300" y="620" width="380" height="90" rx="24" fill="#326CE5"/>
  <text x="3490" y="682" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle">job: deploy</text>
  <text x="3490" y="780" font-size="32" fill="#334155" text-anchor="middle">update-kubeconfig</text>
  <text x="3490" y="850" font-size="32" fill="#334155" text-anchor="middle">swap image tag in</text>
  <text x="3490" y="900" font-size="32" fill="#334155" text-anchor="middle">deployment.yaml</text>
  <text x="3490" y="970" font-size="32" font-family="Menlo, monospace" fill="#0f172a" text-anchor="middle">kubectl apply</text>
  <text x="3490" y="1040" font-size="32" font-family="Menlo, monospace" fill="#0f172a" text-anchor="middle">rollout status</text>
  <circle cx="3300" cy="620" r="48" fill="#dc2626"/>
  <text x="3300" y="640" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>

  <!-- context arrows down -->
  <line x1="2120" y1="540" x2="2120" y2="610" stroke="#d97706" stroke-width="6" stroke-dasharray="14 10" marker-end="url(#arrow)"/>
  <line x1="3490" y1="540" x2="3490" y2="610" stroke="#d97706" stroke-width="6" stroke-dasharray="14 10" marker-end="url(#arrow)"/>

  <!-- ===================== 8. AWS result row ===================== -->
  <rect x="860" y="1720" width="2860" height="340" rx="32" fill="#fffbeb" stroke="#FF9900" stroke-width="6" stroke-dasharray="24 18"/>
  <text x="910" y="1810" font-size="50" font-weight="bold" fill="#b45309">AWS</text>
  <circle cx="860" cy="1720" r="48" fill="#dc2626"/>
  <text x="860" y="1740" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>

  <rect x="1780" y="1780" width="680" height="220" rx="20" fill="#ffffff" stroke="#FF9900" stroke-width="4"/>
  <text x="2120" y="1870" font-size="40" font-weight="bold" fill="#0f172a" text-anchor="middle">ECR</text>
  <text x="2120" y="1940" font-size="36" fill="#334155" text-anchor="middle">school-api:&lt;sha&gt; stored</text>

  <rect x="3040" y="1780" width="640" height="220" rx="20" fill="#ffffff" stroke="#326CE5" stroke-width="4"/>
  <text x="3360" y="1870" font-size="40" font-weight="bold" fill="#0f172a" text-anchor="middle">EKS</text>
  <text x="3360" y="1940" font-size="36" fill="#334155" text-anchor="middle">rolling update → new pods live</text>

  <!-- arrows into AWS row -->
  <line x1="2120" y1="1140" x2="2120" y2="1770" stroke="#2496ED" stroke-width="8" stroke-dasharray="18 12" marker-end="url(#arrow)"/>
  <text x="2210" y="1470" font-size="34" fill="#2496ED">push image</text>
  <line x1="3490" y1="1140" x2="3490" y2="1770" stroke="#326CE5" stroke-width="8" stroke-dasharray="18 12" marker-end="url(#arrow)"/>
  <text x="3560" y="1470" font-size="34" fill="#326CE5">kubectl</text>
</svg>
