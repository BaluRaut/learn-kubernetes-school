# The LFG stack, locally: real Postgres (a database per grower) + LocalStack
# standing in for AWS (SQS zone lanes, S3 raw files, Secrets Manager).
#
#   docker compose -f docker-compose.lfg.yml up --build
#
# Ports: API 4000 · Postgres 5433 (5432 is the school stack's) · LocalStack 4566
services:
  lfg-db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: lfg
      POSTGRES_PASSWORD: lfg          # local only — production creds live in Secrets Manager
      POSTGRES_DB: lfg_admin
    volumes:
      - lfg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lfg"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    # pinned to the last open-source line — newer tags require a license token
    image: localstack/localstack:4.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,s3,secretsmanager
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  lfg-service:
    build: ./apps/lfg-service
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://lfg:lfg@lfg-db:5432/lfg_admin
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test         # LocalStack accepts any credentials
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      lfg-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lfg-data:
