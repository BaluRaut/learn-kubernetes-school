# CircleCI pipeline: Test (Node + Python) -> Build & Push both images to ECR
#                    -> (manual approval) -> Deploy both to EKS
#
# IMPORTANT — contexts:
#   Every job below uses `context: balu-cicd` — your context in CircleCI
#   (Organization Settings -> Contexts). The context must provide:
#     AWS_ACCESS_KEY_ID
#     AWS_SECRET_ACCESS_KEY
#     AWS_ACCOUNT_ID        (12-digit account number)
#     AWS_DEFAULT_REGION    (e.g. ap-south-1 — must match terraform/variables.tf)
version: 2.1

jobs:
  # -------------------------------------------------------------------------
  # 1a) TEST NODE — the school-api. Runs on every push to every branch.
  # -------------------------------------------------------------------------
  test-node:
    docker:
      - image: cimg/node:20.18
    working_directory: ~/repo/apps/school-api
    steps:
      - checkout:
          path: ~/repo
      - restore_cache:
          keys:
            - npm-deps-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run unit tests
          command: npm test

  # -------------------------------------------------------------------------
  # 1b) TEST PYTHON — the school-analytics service. Runs in parallel with 1a.
  # -------------------------------------------------------------------------
  test-python:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/repo/apps/school-analytics
    steps:
      - checkout:
          path: ~/repo
      - restore_cache:
          keys:
            - pip-deps-{{ checksum "requirements.txt" }}
      - run:
          name: Install dependencies
          command: pip install -r requirements.txt pytest
      - save_cache:
          key: pip-deps-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Run tests
          command: pytest test/ -v

  # -------------------------------------------------------------------------
  # 2) BUILD & PUSH — builds BOTH Docker images, pushes them to ECR.
  #    Tagged with the git commit SHA so every deploy is traceable.
  # -------------------------------------------------------------------------
  build-and-push:
    docker:
      - image: cimg/aws:2024.03   # has AWS CLI + Docker CLI preinstalled
    steps:
      - checkout
      - setup_remote_docker       # gives the job a Docker engine to build with
      - run:
          name: Log in to Amazon ECR
          command: |
            aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
              | docker login --username AWS --password-stdin \
                "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - run:
          name: Build and push school-api (Node)
          command: |
            IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/school-api"
            docker build -t "${IMAGE}:${CIRCLE_SHA1}" apps/school-api
            docker tag "${IMAGE}:${CIRCLE_SHA1}" "${IMAGE}:latest"
            docker push "${IMAGE}:${CIRCLE_SHA1}"
            docker push "${IMAGE}:latest"
      - run:
          name: Build and push school-analytics (Python)
          command: |
            IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/school-analytics"
            docker build -t "${IMAGE}:${CIRCLE_SHA1}" apps/school-analytics
            docker tag "${IMAGE}:${CIRCLE_SHA1}" "${IMAGE}:latest"
            docker push "${IMAGE}:${CIRCLE_SHA1}"
            docker push "${IMAGE}:latest"

  # -------------------------------------------------------------------------
  # 3) DEPLOY — points kubectl at the EKS cluster, swaps BOTH image
  #    placeholders for the freshly pushed tags, applies everything,
  #    and waits for both rollouts to finish.
  # -------------------------------------------------------------------------
  deploy-to-eks:
    docker:
      - image: cimg/aws:2024.03
    steps:
      - checkout
      - run:
          name: Install kubectl
          command: |
            curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            sudo install kubectl /usr/local/bin/kubectl
      - run:
          name: Configure kubectl for EKS
          command: |
            aws eks update-kubeconfig \
              --region "$AWS_DEFAULT_REGION" \
              --name school-eks
      - run:
          name: Deploy manifests
          command: |
            REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
            # Replace the placeholders with the exact images built in this pipeline.
            sed -i "s|IMAGE_PLACEHOLDER|${REGISTRY}/school-api:${CIRCLE_SHA1}|" k8s/deployment.yaml
            sed -i "s|ANALYTICS_IMAGE_PLACEHOLDER|${REGISTRY}/school-analytics:${CIRCLE_SHA1}|" k8s/analytics-deployment.yaml
            kubectl apply -f k8s/namespace.yaml
            kubectl apply -f k8s/configmap.yaml
            kubectl apply -f k8s/deployment.yaml
            kubectl apply -f k8s/service.yaml
            kubectl apply -f k8s/analytics-deployment.yaml
            kubectl apply -f k8s/analytics-service.yaml
            kubectl apply -f k8s/hpa.yaml
            # ingress.yaml requires the AWS Load Balancer Controller add-on;
            # uncomment once you have installed it:
            # kubectl apply -f k8s/ingress.yaml
      - run:
          name: Wait for rollouts
          command: |
            kubectl rollout status deployment/school-api -n school --timeout=180s
            kubectl rollout status deployment/school-analytics -n school --timeout=180s

workflows:
  test-build-deploy:
    jobs:
      # Test jobs deliberately get NO context — they don't need AWS credentials.
      # Least privilege: only the jobs that talk to AWS receive the secrets.
      - test-node
      - test-python
      - build-and-push:
          context: balu-cicd
          requires: [test-node, test-python]
          filters:
            branches:
              only: main          # only main gets built and pushed
      - hold-for-approval:        # manual gate: click "Approve" in CircleCI UI
          type: approval
          requires: [build-and-push]
      - deploy-to-eks:
          context: balu-cicd
          requires: [hold-for-approval]
